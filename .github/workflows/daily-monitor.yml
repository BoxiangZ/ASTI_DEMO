name: Daily ASTI monitoring

on:
  # Automatic API collection is paused. Run manually only when a new report is needed.
  workflow_dispatch:

concurrency:
  group: daily-asti-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Refresh articles, prompts, and AI answers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ASTI_PROVIDER: chatgpt
      CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
      CHATGPT_BASE_URL: ${{ secrets.CHATGPT_BASE_URL }}
      CHATGPT_MODEL: ${{ secrets.CHATGPT_MODEL }}
      ASTI_SEARCH_CONTEXT_SIZE: high
      ASTI_TEMPERATURE: "0.2"
      ASTI_MAX_COMPLETION_TOKENS: "2500"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out report repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate collection credentials
        shell: bash
        run: |
          if [[ -z "$CHATGPT_API_KEY" || -z "$CHATGPT_BASE_URL" || -z "$CHATGPT_MODEL" ]]; then
            echo "Missing one or more required repository secrets: CHATGPT_API_KEY, CHATGPT_BASE_URL, CHATGPT_MODEL."
            exit 1
          fi

      - name: Run daily monitoring pipeline
        run: ./scripts/collect_daily.sh

      - name: Commit refreshed report data
        shell: bash
        run: |
          git config user.name "asti-monitor-bot"
          git config user.email "asti-monitor-bot@users.noreply.github.com"
          git add -f database/real_monitor.db
          git add config/pilot_prompts.csv
          git add config/researched_longtails.json
          git add config/topic_strategy.csv
          if git diff --cached --quiet; then
            echo "No report data changed."
            exit 0
          fi
          git commit -m "data: refresh daily ASTI monitoring"
          git push
